[package]
name = "fidtest"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The published crate, not a local checkout — a `path = "/home/<someone>/..."`
# would only build on one machine, and crates.io is what everyone actually gets.
# This tracks the version fsmon itself resolves to, so the harness shows the
# behaviour fsmon really has.
fanotify-fid = "0.7.1"

# Evidence harness for PRIVILEGE-SEPARATION-PLAN.md §5.6b: for each fanotify
# info record kind it prints what the crate's public API exposes. It runs
# against whichever version is in Cargo.lock — build.rs reads that and compiles
# the matching code path — so `cargo update -p fanotify-fid --precise 0.7.0`
# shows the old defect without editing any source. Needs no root and no live
# kernel events.
