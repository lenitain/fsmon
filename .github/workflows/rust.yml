name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Fetch path dependencies
      run: bash .github/scripts/fetch-path-deps.sh
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
